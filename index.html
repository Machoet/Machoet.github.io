<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machoet · 资料库</title>
<meta name="description" content="自用资料存档，书籍与文档备查。">
<style>
/* ============================================================
   Machoet —— 深空科幻 HUD 主题
   深空底色 + 玻璃态面板，霓虹青强调 + 科幻系分类色板
   纯 CSS，无外部依赖
   ============================================================ */
:root {
  --bg-0: #05070d;            /* 最深的底色：深空黑 */
  --bg-1: #0a1120;
  --ink: #dbe7f4;             /* 主文字：冷灰白 */
  --ink-dim: #8b9bb2;
  --ink-faint: #55627a;
  --accent: #38e1ff;          /* 主强调色：霓虹青（亮） */
  --accent-dim: #22d3ee;      /* 霓虹青（暗，用于边框） */
  --accent-soft: rgba(34, 211, 238, 0.1);
  --accent-glow: rgba(56, 225, 255, 0.45);   /* 强调色辉光（边框 hover 态） */
  --electric: #4f8dff;        /* 辅助色：电光蓝 */
  --glass: rgba(11, 18, 32, 0.6);
  --glass-border: rgba(148, 210, 255, 0.1);
  --glass-hover: rgba(148, 210, 255, 0.28);
  /* 分类色：科幻系低饱和霓虹色板 */
  --c-graphics: #3ee6c4;      /* 青绿 */
  --c-cpp: #66b3ff;           /* 冰蓝 */
  --c-se: #b78cff;            /* 紫罗兰 */
  --c-algo: #ffb454;          /* 琥珀橙 */
  --c-note: #8be9fd;          /* 浅青 */
  --font-display: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', SimSun, Georgia, serif;
  --font-body: 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  --font-mono: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

::selection { background: rgba(56, 225, 255, 0.25); color: var(--ink); }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg-0);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.7;
  overflow-x: hidden;
}

/* ---------- 背景氛围：渐变光斑 + 颗粒 ---------- */
.backdrop {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 55% 42% at 78% -6%, rgba(56, 225, 255, 0.055) 0%, transparent 65%),
    radial-gradient(ellipse 48% 40% at 8% 24%, rgba(79, 141, 255, 0.045) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 50% 108%, rgba(183, 140, 255, 0.04) 0%, transparent 62%),
    linear-gradient(175deg, var(--bg-1) 0%, var(--bg-0) 55%);
}
/* 全息网格：极低对比的青色网格线，中心区域渐隐，仅作背景细节 */
.backdrop::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(56, 225, 255, 0.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56, 225, 255, 0.022) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse 90% 75% at 50% 20%, #000 0%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 90% 75% at 50% 20%, #000 0%, transparent 100%);
}
.backdrop::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
}

/* 背景星空画布（青白粒子，JS 绘制） */
#starfield {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* 缓慢飘浮的光晕 */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
  animation: drift 26s ease-in-out infinite alternate;
}
.orb-a { width: 420px; height: 420px; top: -140px; right: -100px; background: rgba(56, 225, 255, 0.05); }
.orb-b { width: 360px; height: 360px; bottom: -120px; left: -120px; background: rgba(79, 141, 255, 0.045); animation-delay: -13s; }
@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(-50px, 46px) scale(1.15); }
}

.page {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ---------- 入场动画 ---------- */
@keyframes rise {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}
.rise { opacity: 0; animation: rise 0.7s cubic-bezier(0.22, 0.9, 0.3, 1) forwards; }

/* ============================================================
   顶部导航栏（sticky + 毛玻璃）
   ============================================================ */
.topnav {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(5, 7, 13, 0.72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: 0 1px 0 rgba(56, 225, 255, 0.05), 0 8px 30px -18px rgba(56, 225, 255, 0.25);
}
.topnav-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  gap: 18px;
}
.brand {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--ink);
  text-decoration: none;
  white-space: nowrap;
}
.brand:hover { color: var(--accent); }
.nav-links {
  display: flex;
  gap: 4px;
  margin: 0 auto;
}
.nav-links a {
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  color: var(--ink-dim);
  text-decoration: none;
  white-space: nowrap;
  transition: color 0.2s, background 0.2s;
}
.nav-links a:hover {
  color: var(--accent);
  background: var(--accent-soft);
}
.nav-icons { display: flex; gap: 8px; }
.nav-icons a {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--glass-border);
  display: grid;
  place-items: center;
  color: var(--ink-dim);
  transition: color 0.2s, border-color 0.2s;
}
.nav-icons a:hover { color: var(--accent); border-color: var(--accent-glow); box-shadow: 0 0 12px -4px var(--accent-glow); }
.nav-icons svg { width: 16px; height: 16px; }

/* ============================================================
   Hero · 个人简介（垂直居中，约 70vh）
   ============================================================ */
.hero {
  min-height: 70vh;
  padding: 56px 0 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  scroll-margin-top: 76px;
}
.avatar {
  flex-shrink: 0;
  width: 112px;
  height: 112px;
  margin: 28px 0 24px;
  border-radius: 50%;
  background: #0b1220;
  box-shadow:
    0 0 0 1px rgba(190, 225, 255, 0.2),
    0 0 0 9px rgba(56, 225, 255, 0.06),
    0 18px 44px rgba(0, 0, 0, 0.5);
  position: relative;
}
.avatar img {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}
/* 头像加载失败时的字母后备（默认隐藏，img onerror 时显示） */
.avatar-fallback {
  display: none;
  position: absolute;
  inset: 0;
  border-radius: 50%;
  place-items: center;
  font-family: var(--font-display);
  font-size: 3rem;
  font-weight: 700;
  color: var(--bg-0);
  background: linear-gradient(140deg, #eaf6ff 0%, #9fc4e0 48%, #5c7a99 100%);
}
.avatar::after {           /* 外圈虚线装饰 */
  content: '';
  position: absolute;
  inset: -9px;
  border-radius: 50%;
  border: 1px dashed rgba(56, 225, 255, 0.35);
  animation: spin 40s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* HUD 标签样式：矩形边框 + 对角角标 */
.hero-eyebrow {
  position: relative;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.3em;
  color: var(--accent);
  padding: 6px 12px 6px 17px;   /* 右侧收窄以抵消末字符字距 */
  border: 1px solid rgba(56, 225, 255, 0.3);
  background: rgba(56, 225, 255, 0.05);
}
.hero-eyebrow::before,
.hero-eyebrow::after {
  content: '';
  position: absolute;
  width: 7px;
  height: 7px;
  border: 1px solid var(--accent);
}
.hero-eyebrow::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.hero-eyebrow::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 6vw, 3.8rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0.05em;
}
.hero-bio {
  margin-top: 16px;
  max-width: 560px;
  color: var(--ink-dim);
  font-size: 0.98rem;
}
.social-link {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 0.88rem;
  color: var(--ink);
  text-decoration: none;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s, color 0.25s;
}
.social-link:hover {
  transform: translateY(-2px);
  color: var(--accent);
  border-color: var(--accent-glow);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4), 0 0 18px -6px var(--accent-glow);
}

/* 统计条 */
.hero-stats {
  width: 100%;
  max-width: 820px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 44px;
}
.stat {
  flex: 1;
  min-width: 130px;
  padding: 16px 20px;
  border-radius: 16px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.stat b {
  display: block;
  font-family: var(--font-mono);
  font-size: 1.5rem;
  color: var(--accent);
  line-height: 1.3;
}
.stat span { font-size: 0.78rem; color: var(--ink-faint); letter-spacing: 0.08em; }

/* ============================================================
   内容板块与工具栏
   ============================================================ */
.block {
  margin-top: 96px;
  scroll-margin-top: 84px;      /* 锚点跳转时避开 sticky 导航 */
}
.block-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 26px;
}
.block-head h2 {
  font-family: var(--font-display);
  font-size: 1.7rem;
  font-weight: 700;
  letter-spacing: 0.06em;
}
.block-head .tally {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--ink-faint);
  white-space: nowrap;
}
.block-head .rule {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--glass-border), transparent);
}

.toolbar {
  margin: 0 0 30px;
  padding: 18px;
  border-radius: 20px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: sticky;
  top: 74px;                    /* 避开顶部导航栏 */
  z-index: 5;
  box-shadow:
    0 14px 40px rgba(0, 0, 0, 0.35),
    0 0 28px -18px var(--accent-glow),
    inset 0 1px 0 rgba(148, 210, 255, 0.07);
}
.search-wrap { position: relative; }
.search-wrap svg {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 17px;
  height: 17px;
  color: var(--ink-faint);
  pointer-events: none;
}
#searchInput {
  width: 100%;
  padding: 12px 16px 12px 46px;
  border-radius: 12px;
  border: 1px solid var(--glass-border);
  background: rgba(4, 8, 16, 0.6);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 0.94rem;
  outline: none;
  transition: border-color 0.25s, box-shadow 0.25s;
}
#searchInput::placeholder { color: var(--ink-faint); }
#searchInput:focus {
  border-color: rgba(56, 225, 255, 0.55);
  box-shadow: 0 0 0 3px var(--accent-soft), 0 0 16px -6px var(--accent-glow);
}
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 7px 16px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: transparent;
  color: var(--ink-dim);
  font-family: var(--font-body);
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.22s;
}
.chip:hover { color: var(--ink); border-color: var(--glass-hover); }
.chip.active {
  background: var(--accent-soft);
  border-color: rgba(56, 225, 255, 0.55);
  color: var(--accent);
  box-shadow: 0 0 12px -5px var(--accent-glow);
}
.chip .count { font-family: var(--font-mono); font-size: 0.72rem; opacity: 0.75; margin-left: 4px; }

/* ============================================================
   资料分区与卡片
   ============================================================ */
.section-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin: 46px 0 20px;
}
.section-head h3 {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.section-head .tally {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--ink-faint);
}
.section-head::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--glass-border), transparent);
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

.card {
  display: flex;
  gap: 16px;
  padding: 20px;
  border-radius: 18px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  text-decoration: none;
  color: var(--ink);
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 20px -16px var(--cat, var(--accent));
  transition: transform 0.3s cubic-bezier(0.22, 0.9, 0.3, 1), border-color 0.3s, box-shadow 0.3s;
}
.card::before {           /* 顶部分类色细线 */
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--cat, var(--accent)), transparent 75%);
  opacity: 0.65;
}
.card:hover {
  transform: translateY(-5px);
  border-color: color-mix(in srgb, var(--cat, var(--accent)) 45%, transparent);
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45), 0 0 34px -10px var(--cat, var(--accent));
}
/* 书脊样式的图标块 */
.card-spine {
  flex-shrink: 0;
  width: 46px;
  height: 62px;
  border-radius: 5px 9px 9px 5px;
  background: linear-gradient(155deg, color-mix(in srgb, var(--cat, var(--accent)) 22%, #0d1626), #0a101d);
  border: 1px solid color-mix(in srgb, var(--cat, var(--accent)) 35%, transparent);
  border-left: 4px solid var(--cat, var(--accent));
  display: grid;
  place-items: center;
  color: var(--cat, var(--accent));
  transition: transform 0.3s;
}
.card:hover .card-spine { transform: rotate(-4deg) translateY(-2px); }
.card-spine svg { width: 20px; height: 20px; }

.card-body { flex: 1; min-width: 0; }
.card-title {
  font-size: 0.98rem;
  font-weight: 600;
  line-height: 1.45;
  margin-bottom: 4px;
  transition: color 0.25s;
}
.card:hover .card-title { color: var(--cat, var(--accent)); }
.card-desc {
  font-size: 0.8rem;
  color: var(--ink-dim);
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--ink-faint);
}
.card-meta .tag {
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--cat, var(--accent)) 40%, transparent);
  color: var(--cat, var(--accent));
}
.card-meta .open-hint {
  margin-left: auto;
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity 0.25s, transform 0.25s;
  color: var(--cat, var(--accent));
}
.card:hover .open-hint { opacity: 1; transform: translateX(0); }

/* 空状态 */
.empty {
  padding: 52px 24px;
  border-radius: 18px;
  border: 1px dashed var(--glass-border);
  background: rgba(11, 18, 32, 0.32);
  text-align: center;
  color: var(--ink-faint);
  font-size: 0.9rem;
}

/* ============================================================
   页脚
   ============================================================ */
footer {
  margin-top: 110px;
  padding: 44px 0 52px;
  border-top: 1px solid var(--glass-border);
  font-size: 0.8rem;
  color: var(--ink-faint);
}
.footer-inner {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 36px;
  flex-wrap: wrap;
}
.footer-brand {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 8px;
}
.footer-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 14px;
}
/* 终端风格概况面板（HUD 边框 + 微辉光） */
.footer-panel {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  line-height: 1.9;
  padding: 14px 20px;
  border-radius: 12px;
  border: 1px solid rgba(56, 225, 255, 0.16);
  background: rgba(8, 13, 24, 0.55);
  color: var(--ink-dim);
  white-space: pre;
  text-align: left;
  min-width: 220px;
  box-shadow: 0 0 24px -14px var(--accent-glow), inset 0 1px 0 rgba(148, 210, 255, 0.06);
}
.footer-panel .p { color: var(--accent); }
.footer-panel .k { color: var(--ink-faint); }
.footer-panel .v { color: var(--ink); }
.footer-links { display: flex; gap: 10px; flex-wrap: wrap; }
footer .mono { font-family: var(--font-mono); letter-spacing: 0.06em; }
footer a { color: var(--ink-dim); text-decoration: none; border-bottom: 1px dotted var(--ink-faint); }
footer a:hover { color: var(--accent); border-color: var(--accent); }
footer .footer-links a { border-bottom: none; }

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 640px) {
  .topnav-inner { padding: 0 14px; gap: 8px; height: 54px; overflow-x: auto; }
  .nav-links a { padding: 6px 10px; font-size: 0.8rem; }
  .hero { min-height: 62vh; padding: 40px 0 32px; }
  .avatar { width: 88px; height: 88px; margin: 22px 0 18px; }
  .avatar-fallback { font-size: 2.3rem; }
  .block { margin-top: 72px; }
  .toolbar { position: static; padding: 14px; }
  .card-grid { grid-template-columns: 1fr; }
  .stat { min-width: calc(50% - 6px); }
  .footer-inner { flex-direction: column; align-items: flex-start; }
  .footer-right { align-items: flex-start; }
  .footer-panel { width: 100%; }
  .project-head { flex-wrap: wrap; }
  .skill-tag { padding: 6px 13px; font-size: 0.76rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .rise { opacity: 1; }
}

/* ============================================================
   项目 / 技能板块 · 页脚时钟（追加样式，不改动既有选择器）
   ============================================================ */
/* 项目卡片：标题与状态徽标同行 */
.project-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}
/* 状态徽标：小号 mono 胶囊，三种状态配色 */
.card-status {
  flex-shrink: 0;
  padding: 1px 10px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.05em;
  white-space: nowrap;
}

  }[c]));
}

const LFS_MEDIA_BASE = 'https://media.githubusercontent.com/media/Machoet/Machoet.github.io/main/';

function encodeHref(href) {

  pdf:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>'
};

function cardHTML(item, delay) {
  const cat = catInfo(item.category);
  const external = /^https?:\/\//i.test(item.href);
  return `
    <a class="card rise" style="--cat:${cat.color};animation-delay:${delay}s"
       href="${escapeHtml(encodeHref(item.href))}" target="_blank" rel="noopener noreferrer"
       title="打开：${escapeHtml(item.title)}">
      <span class="card-spine">${ICONS[item.type] || ICONS.pdf}</span>
      <span class="card-body">
        <span class="card-title">${escapeHtml(item.title)}</span>
        ${item.desc ? `<span class="card-desc">${escapeHtml(item.desc)}</span>` : ''}
        <span class="card-meta">
          <span class="tag">${escapeHtml(cat.name)}</span>
          ${item.size ? `<span>${escapeHtml(item.size)}</span>` : ''}
          <span class="open-hint">${external ? '访问 →' : '打开 →'}</span>
        </span>
      </span>
    </a>`;
}

function emptyHTML(text) {
  return `<div class="empty">${escapeHtml(text)}</div>`;
}

/* 分类信息（未在 CATEGORIES 登记的 key 用 fallback 名称/颜色兜底） */
function catInfo(key) {
  return CATEGORIES[key] || { name: key, color: 'var(--accent)' };
}

/* 书籍分类 key 列表：CATEGORIES 定义的顺序优先，
   数据中出现但未登记的分类追加在后面，确保条目不会静默丢失 */
function bookCategoryKeys() {
  const keys = Object.keys(CATEGORIES).filter(k => k !== 'note');
  for (const b of books) {
    if (!keys.includes(b.category)) keys.push(b.category);
  }
  return keys;
}

/* ---- 渲染书籍区：按分类分组 ---- */
function renderBooks() {
  const kw = keyword.trim().toLowerCase();
  const match = b =>
    (activeCategory === 'all' || b.category === activeCategory) &&
    (!kw || b.title.toLowerCase().includes(kw) || (b.desc || '').toLowerCase().includes(kw));

  const visible = books.filter(match);
  const area = $('#bookArea');
  $('#bookTally').textContent = visible.length === books.length
    ? `共 ${books.length} 本`
    : `${visible.length} / ${books.length} 本`;

  if (!visible.length) {
    area.innerHTML = emptyHTML('没有找到匹配的资料。');
    return;
  }

  let html = '';
  let delay = 0;
  for (const key of bookCategoryKeys()) {
    const group = visible.filter(b => b.category === key);
    if (!group.length) continue;
    html += `
      <div class="section-head">
        <h3>${escapeHtml(catInfo(key).name)}</h3>
        <span class="tally">${group.length} 本</span>
      </div>
      <div class="card-grid">
        ${group.map(b => cardHTML(b, Math.min(delay += 0.05, 0.5))).join('')}
      </div>`;
  }
  area.innerHTML = html;
}

/* ---- 渲染笔记 / 文档区 ---- */
function renderNotes() {
  $('#noteTally').textContent = `共 ${notes.length} 篇`;
  $('#noteArea').innerHTML = notes.length
    ? `<div class="card-grid">${notes.map((n, i) => cardHTML(n, 0.1 + i * 0.05)).join('')}</div>`
    : emptyHTML('暂无笔记。在页面源码的 RESOURCES 数组中添加 type 为 "note" 或 "link" 的条目即可。');
}

/* ---- 分类筛选按钮 ---- */
function renderChips() {
  const chips = [{ key: 'all', name: '全部', count: books.length }]
    .concat(bookCategoryKeys()
      .map(k => ({ key: k, name: catInfo(k).name, count: books.filter(b => b.category === k).length })));

  $('#chipBar').innerHTML = chips.map(c => `
    <button class="chip${c.key === activeCategory ? ' active' : ''}" data-cat="${escapeHtml(c.key)}"
            role="tab" aria-selected="${c.key === activeCategory}">
      ${escapeHtml(c.name)}<span class="count">${c.count}</span>
    </button>`).join('');
}

/* ---- 顶部统计 ---- */
/* 解析 "317 MB" 这类 size 文本为 MB 数值，无法解析按 0 处理 */
function parseSizeMB(size) {
  const m = /([\d.]+)\s*(GB|MB|KB)/i.exec(size || '');
  if (!m) return 0;
  const mul = { KB: 1 / 1024, MB: 1, GB: 1024 }[m[2].toUpperCase()];
  return parseFloat(m[1]) * mul;
}

function formatTotalSize(mb) {
  return mb >= 1024 ? `${(mb / 1024).toFixed(1)} GB` : `${Math.round(mb)} MB`;
}

function renderStats() {
  const totalMB = RESOURCES.reduce((sum, r) => sum + parseSizeMB(r.size), 0);
  $('#heroStats').innerHTML = `
    <div class="stat"><b>${books.length}</b><span>册藏书</span></div>
    <div class="stat"><b>${bookCategoryKeys().length}</b><span>个分类</span></div>
    <div class="stat"><b>${formatTotalSize(totalMB)}</b><span>资料体积</span></div>
    <div class="stat"><b>${notes.length}</b><span>笔记文档</span></div>
    <div class="stat"><b>${PROJECTS.length}</b><span>个项目</span></div>`;
}

/* ---- 页脚概况面板（终端风格，复用同一套统计数据） ---- */
function renderFooterPanel() {
  const totalMB = RESOURCES.reduce((sum, r) => sum + parseSizeMB(r.size), 0);
  $('#footerPanel').innerHTML =
    `<span class="p">$ stats</span>\n` +
    `<span class="k">books   </span> : <span class="v">${books.length}</span>\n` +
    `<span class="k">size    </span> : <span class="v">${formatTotalSize(totalMB)}</span>\n` +
    `<span class="k">cats    </span> : <span class="v">${bookCategoryKeys().length}</span>\n` +
    `<span class="k">notes   </span> : <span class="v">${notes.length}</span>\n` +
    `<span class="k">projects</span> : <span class="v">${PROJECTS.length}</span>`;
}

/* ---- 渲染项目 / 实验区 ---- */
/* status 文案 → 徽标配色修饰符（未知状态按「实验性」兜底） */
const PROJECT_STATUS_MOD = { '进行中': 'ongoing', '已完成': 'done', '实验性': 'exp' };

function projectCardHTML(p, delay) {
  const mod = PROJECT_STATUS_MOD[p.status] || 'exp';
  const inner = `
    <span class="card-body">
      <span class="project-head">
        <span class="card-title">${escapeHtml(p.title)}</span>
        <span class="card-status card-status--${mod}">${escapeHtml(p.status)}</span>
      </span>
      ${p.desc ? `<span class="card-desc">${escapeHtml(p.desc)}</span>` : ''}
      ${(p.tech && p.tech.length) ? `<span class="card-tags">${p.tech.map(t => `<span class="tag-tech">${escapeHtml(t)}</span>`).join('')}</span>` : ''}
    </span>`;
  const style = `--cat:var(--accent);animation-delay:${delay}s`;
  /* 有 href 用可点击的 <a>，留空则用不可点的 <div>，避免出现死链接 */
  return p.href
    ? `<a class="card rise" style="${style}" href="${escapeHtml(encodeHref(p.href))}" target="_blank" rel="noopener noreferrer" title="打开：${escapeHtml(p.title)}">${inner}</a>`
    : `<div class="card rise" style="${style}">${inner}</div>`;
}

function renderProjects() {
  $('#projectTally').textContent = `共 ${PROJECTS.length} 个`;
  $('#projectArea').innerHTML = PROJECTS.length
    ? `<div class="card-grid">${PROJECTS.map((p, i) => projectCardHTML(p, 0.1 + i * 0.05)).join('')}</div>`
    : `<div class="empty empty--dashed">暂无项目。在页面源码的 PROJECTS 数组中添加条目即可，支持状态标签与技术栈标签。</div>`;
}

/* ---- 渲染技能档案区：按 group 分组的标签云 ---- */
function renderSkills() {
  $('#skillArea').innerHTML = SKILLS.length
    ? SKILLS.map(g => `
        <div class="skill-group">
          <p class="skill-group-name">${escapeHtml(g.group)}</p>
          <div class="skill-tags">${(g.items || []).map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('')}</div>
        </div>`).join('')
    : `<div class="empty empty--dashed">技能档案待补充。</div>`;
}

/* ---- 页脚实时时钟（本地 + UTC，每秒更新，独立于统计渲染） ---- */
function startFooterClock() {
  const el = $('#footerClock');
  if (!el) return;
  const pad = n => String(n).padStart(2, '0');
  const tick = () => {
    const d = new Date();
    el.textContent =
      `LOC ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` +
      ` | UTC ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
  };
  tick();
  setInterval(tick, 1000);
}

/* ---- 渲染首页板块入口卡片（计数复用既有数据源，不另设状态） ---- */
function renderHomeEntries() {
  const entries = [
    { view: 'projects', name: '项目 / 实验', desc: '个人项目与实验性尝试', count: `${PROJECTS.length} 个项目` },
    { view: 'library',  name: '书籍资料库', desc: '按分类整理的藏书，支持搜索与筛选', count: `${books.length} 本藏书` },
    { view: 'notes',    name: '笔记 / 文档', desc: '学习笔记与文档链接归档', count: `${notes.length} 篇笔记` },
    { view: 'skills',   name: '技能档案',   desc: '按分组归档的技能标签云', count: `${SKILLS.length} 个分组` }
  ];
  /* 入口卡片为普通锚链接，点击后由 hashchange 监听完成视图切换 */
  $('#homeEntries').innerHTML = entries.map((e, i) => `
    <a class="entry-card rise" style="animation-delay:${(0.5 + i * 0.06).toFixed(2)}s" href="#${e.view}">
      <span class="entry-card-name">${escapeHtml(e.name)}</span>
      <span class="entry-card-desc">${escapeHtml(e.desc)}</span>
      <span class="entry-card-count">${escapeHtml(e.count)}<span class="entry-arrow">进入 →</span></span>
    </a>`).join('');
}

/* ============================================================
 * Hash 路由：单文件视图切换
 * ------------------------------------------------------------
 * 视图容器以 data-view 属性标识，同一时间仅一个视图持有 .active。
 * location.hash 为唯一路由来源；未知或空 hash 回落 home。
 * 视图显隐由 CSS 的 display 切换实现；.rise 入场动画在
 * display:none 期间不执行，视图重新显示时浏览器自动从头
 * 播放，无需额外的 class 移除 / 重添操作。
 * ============================================================ */
const VALID_VIEWS = ['home', 'projects', 'library', 'notes', 'skills'];

/* 历史锚点别名映射：兼容旧版页内锚点链接（#books、#top），
   命中时重定向至对应视图，避免外部已分发的链接失效 */
const HASH_ALIASES = { books: 'library', top: 'home' };

/* 各视图对应的文档标题 */
const VIEW_TITLES = {
  home:     'Machoet · 资料库',
  projects: 'Machoet · 项目',
  library:  'Machoet · 书籍资料库',
  notes:    'Machoet · 笔记',
  skills:   'Machoet · 技能'
};

/* 解析 location.hash 为合法视图名；历史锚点按别名表映射，未知或空 hash 回落 'home' */
function currentView() {
  const name = location.hash.replace(/^#/, '');
  if (VALID_VIEWS.includes(name)) return name;
  if (Object.prototype.hasOwnProperty.call(HASH_ALIASES, name)) return HASH_ALIASES[name];
  return 'home';
}

/* 应用指定视图：切换视图容器、同步导航高亮与文档标题、回滚页面顶部 */
function applyView(view) {
  document.querySelectorAll('.view').forEach(el => {
    el.classList.toggle('active', el.dataset.view === view);
  });
  document.querySelectorAll('.nav-links a').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === '#' + view);
  });
  document.title = VIEW_TITLES[view] || VIEW_TITLES.home;
  /* behavior 显式指定 instant，避免全局 scroll-behavior:smooth 在切换时产生平滑回滚；
     旧版浏览器可能对未知枚举值抛出 TypeError，降级为传统参数形式 */
  try { window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); }
  catch (err) { window.scrollTo(0, 0); }
}

/* 初始化路由：处理首次进入与 hashchange（含浏览器前进 / 后退） */
function initRouter() {
  window.addEventListener('hashchange', () => applyView(currentView()));
  applyView(currentView());
}

/* ---- 事件绑定 ---- */
$('#chipBar').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  activeCategory = btn.dataset.cat;
  renderChips();
  renderBooks();
});

/* 搜索输入 150ms 防抖：停止输入后再触发渲染，减少连续按键时的重复重排 */
let searchTimer = 0;
$('#searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    keyword = e.target.value;
    renderBooks();
  }, 150);
});

/* ---- 初始渲染 ---- */
$('#year').textContent = new Date().getFullYear();
renderStats();
renderFooterPanel();
renderChips();
renderBooks();
renderNotes();
renderProjects();
renderSkills();
renderHomeEntries();
startFooterClock();
initRouter();

/* ============================================================
 * 背景星空：青白色粒子缓慢漂移 + 闪烁，近距离粒子间连细线。
 * 无外部依赖；requestAnimationFrame 驱动，标签页隐藏时暂停；
 * prefers-reduced-motion 时降级为静态一帧。
 * ============================================================ */
(function starfield() {
  const canvas = document.getElementById('starfield');
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LINK_DIST = 110;          // 连线的最大距离（px）
  let stars = [];
  let raf = 0;
  let running = false;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    /* 粒子数随面积自适应，上限 120，保证性能 */
    const count = Math.min(120, Math.round(canvas.width * canvas.height / 14000));
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: 0.4 + Math.random() * 1.2,               // 半径
      vx: (Math.random() - 0.5) * 0.12,           // 漂移速度（很慢）
      vy: (Math.random() - 0.5) * 0.12,
      tw: Math.random() * Math.PI * 2,            // 闪烁相位
      ts: 0.008 + Math.random() * 0.018           // 闪烁速度
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    /* 连线：低透明度青白，越近越明显 */
    ctx.lineWidth = 0.5;
    for (let i = 0; i < stars.length; i++) {
      for (let j = i + 1; j < stars.length; j++) {
        const dx = stars[i].x - stars[j].x;
        const dy = stars[i].y - stars[j].y;
        const d2 = dx * dx + dy * dy;
        if (d2 < LINK_DIST * LINK_DIST) {
          ctx.strokeStyle = `rgba(170,225,255,${(0.06 * (1 - Math.sqrt(d2) / LINK_DIST)).toFixed(3)})`;
          ctx.beginPath();
          ctx.moveTo(stars[i].x, stars[i].y);
          ctx.lineTo(stars[j].x, stars[j].y);
          ctx.stroke();
        }
      }
    }
    /* 星点：青白小圆点，透明度随相位闪烁 */
    for (const s of stars) {
      ctx.fillStyle = `rgba(205,240,255,${(0.2 + 0.4 * (0.5 + 0.5 * Math.sin(s.tw))).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop() {
    for (const s of stars) {
      s.x += s.vx;
      s.y += s.vy;
      s.tw += s.ts;
      /* 超出边界从对侧回绕 */
      if (s.x < -5) s.x = canvas.width + 5;
      else if (s.x > canvas.width + 5) s.x = -5;
      if (s.y < -5) s.y = canvas.height + 5;
      else if (s.y > canvas.height + 5) s.y = -5;
    }
    draw();
    raf = requestAnimationFrame(loop);
  }

  function start() {
    if (reduceMotion) { draw(); return; }   // 降级：静态一帧
    if (!running) { running = true; raf = requestAnimationFrame(loop); }
  }
  function stop() {
    cancelAnimationFrame(raf);
    running = false;
  }

  window.addEventListener('resize', () => { resize(); if (reduceMotion) draw(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stop();
    else start();
  });

  resize();
  start();
})();
</script>

</body>
